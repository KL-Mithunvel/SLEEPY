name: CI

# Mechanical backstop for Development Rule 10 ("test before every commit"):
# runs the same two gates the workflow already requires by hand —
# tooling/run-backend-tests.bat and `npm run build` — on every push and PR
# to main or canary.
#
# `canary` is the gate in front of `prod`: a push to canary runs both jobs,
# and ONLY if both pass does the `promote` job fast-forward `prod` to that
# same commit. A red run leaves prod where it was. Promotion only moves the
# branch — it deploys nothing; deploying stays a manual, permission-gated step
# on the EC2 box (tooling/deploy-prod.sh), per
# ".claude/CLAUDE.md#dev-prod-environment-separation--deploy-workflow".

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

# Least privilege: CI only reads the code. Without this the job's
# GITHUB_TOKEN gets the repo's default permissions, which can include write.
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        working-directory: .
        run: uv sync

      - name: Run backend tests
        # Mirrors tooling/run-backend-tests.bat exactly: cd code/backend, bare
        # `uv run pytest` — uv discovers the repo-root pyproject.toml/uv.lock
        # by walking up from cwd, same as the local wrapper relies on.
        env:
          DEV_AUTH_BYPASS: "1"
          SQLITE_DB_PATH: ":memory:"
        run: uv run pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  promote:
    # Fast-forward prod to the canary commit that just went green. `git push`
    # without --force is itself the safety: it is rejected if prod has
    # commits canary lacks, so history can never be rewritten from here.
    # The only job with write access; everything above stays read-only.
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fast-forward prod to this commit
        run: git push origin "${GITHUB_SHA}:refs/heads/prod"
