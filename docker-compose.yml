version: "3.9"

# Production Docker Compose — deploy on an AWS EC2 host
# Exposed public URL: https://klm.smtw.in (TLS terminated by the host's own
# nginx + certbot, NOT by a container — backend/frontend publish to
# 127.0.0.1 only and the host nginx reverse-proxies to them; see
# tooling/nginx-klm.smtw.in.conf).
#
# Before first deploy:
#   1. Copy code/backend/example_secrets_app.py → code/backend/secrets_app.py and fill in values
#      (never let it into the build context — see .dockerignore)
#   2. Create ./data/klm/ directory tree and ensure it is a git repo
#   3. `docker compose build` then `docker compose up -d`
#
# Auth is self-issued JWT (see auth_utils.py) — no external identity provider.
#
# ChromaDB stays its own container rather than an embedded PersistentClient:
# the worker process writes (md_reindex/index_sync) while the backend process
# reads (RAG queries) concurrently — two separate OS processes hitting the
# same embedded on-disk store is exactly what Chroma's docs warn against.

services:

  # ---------------------------------------------------------------------------
  # Backend — Flask / gunicorn
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DEV_AUTH_BYPASS=0
      - SQLITE_DB_PATH=/data/klm/db/sqlite/pma.db
      - USER_DATA_ROOT=/data/klm
      - DATA_ROOT=/data
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CORS_ORIGINS=https://klm.smtw.in
      # Nightly cron schedule (scheduled_tasks.py) is written in IST wall-clock
      # terms (e.g. 06:30 morning briefing) — without this the container's
      # default UTC clock fires everything 5.5 hours off.
      - TZ=Asia/Kolkata
    volumes:
      # Path must match where `import secrets_app` actually looks (PYTHONPATH=
      # /app/code/backend, set below) — mounting to /app/backend/ silently
      # does nothing (config.py falls back to no secrets_app at all).
      - ./code/backend/secrets_app.py:/app/code/backend/secrets_app.py:ro
      - pma_data:/data
    security_opt:
      - no-new-privileges:true
    depends_on:
      chromadb:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Worker — APScheduler + task queue drainer
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uv", "run", "python", "code/backend/worker.py"]
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DEV_AUTH_BYPASS=0
      - SQLITE_DB_PATH=/data/klm/db/sqlite/pma.db
      - USER_DATA_ROOT=/data/klm
      - DATA_ROOT=/data
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CORS_ORIGINS=https://klm.smtw.in
      - TZ=Asia/Kolkata
      # The self_check job (selfheal.py) probes the web process from here.
      # The default is localhost, which in this container is the worker
      # itself — it has to be the backend service by name.
      - HEALTH_CHECK_URL=http://backend:5000/healthz
    volumes:
      - ./code/backend/secrets_app.py:/app/code/backend/secrets_app.py:ro
      - pma_data:/data
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend — static Vite build served by nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  # ---------------------------------------------------------------------------
  # ChromaDB — vector store
  # ---------------------------------------------------------------------------
  chromadb:
    # Must match the chromadb Python client version (pyproject.toml) — the
    # wire protocol isn't backward compatible across major versions. Was
    # pinned to 0.5.20 against a 1.5.9 client, which silently broke every
    # index write (KeyError('_type') on every upsert — 0 chunks ever
    # indexed) until caught live during the Phase 6 final deploy.
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      # Backend/worker talk to Chroma over its HTTP API (CHROMA_HOST/PORT) —
      # nothing reads its storage files directly, so it gets its own volume
      # instead of the shared pma_data mount that has the SQLite DB and the
      # full corpus on it. A compromised chromadb container can now only
      # touch its own vector index, not the rest of the app's data.
      #
      # 1.5.9 hardcodes /data as its persist path and ignores
      # PERSIST_DIRECTORY entirely (confirmed empirically — writes landed in
      # the container's ephemeral /data while /chroma_data sat stale, so
      # every recreate would have silently dropped the whole vector index).
      - pma_chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    # No healthcheck: the 1.5.9 image is minimal (no curl/wget/python/busybox,
    # just /bin/sh), so there's no in-container tool left to run an HTTP
    # check with. backend/worker depend on service_started instead of
    # service_healthy below.

volumes:
  pma_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  pma_chroma_data:
