# Reference config for the klm.smtw.in server blocks inside the AWS box's
# /etc/nginx/nginx.conf. NOT auto-applied — this file documents what those
# two server{} blocks should look like; Phase 3 of the deploy plan splices
# this in by hand (after backing up nginx.conf) once the backend/frontend
# containers are actually up and listening on 127.0.0.1:5000 / 127.0.0.1:8080.
#
# Do NOT touch the ssl_certificate / ssl_certificate_key / include / ssl_dhparam
# lines below — those are certbot-managed and must keep pointing at the
# existing /etc/letsencrypt/live/klm.smtw.in/ cert. Renewal (certbot renew,
# already presumably on a system timer) rewrites this same block in place and
# is unaffected by the location/proxy changes here.

# Per-IP throttle for the login endpoint. The app's own lockout is keyed on
# (username, ip) and on ip, but nginx dropping the flood before it reaches
# gunicorn is what actually keeps a credential-stuffing run from tying up the
# single backend process. Must live at http{} level — put it next to the
# other zone definitions in nginx.conf, not inside server{}.
limit_req_zone $binary_remote_addr zone=sleepy_login:1m rate=10r/m;

server {
    server_name  klm.smtw.in;

    # Flask's MAX_CONTENT_LENGTH is 2 MB (app.py) — nginx's default 1 MB would
    # otherwise 413 a large Projects-editor save before Flask ever sees it.
    client_max_body_size 2m;

    location = /api/auth/login {
        limit_req zone=sleepy_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI chat is a long-lived SSE stream (POST /api/ai/chat) — must not be
    # buffered or it'll stall until the connection closes. Applies to all of
    # /api/ since none of the other endpoints are latency-sensitive enough
    # to care about the extra proxy_buffering-off overhead.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        proxy_set_header Host $host;
    }

    # SPA — the frontend container's own nginx already does the Vue Router
    # try_files fallback internally, so this just proxies everything else.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Security headers (carried over from the repo's old Caddyfile design)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/klm.smtw.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/klm.smtw.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Unchanged from the existing certbot-managed config — plain HTTP redirects
# straight to HTTPS.
server {
    if ($host = klm.smtw.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen       80;
    listen       [::]:80;
    server_name  klm.smtw.in;
    return 404; # managed by Certbot
}
